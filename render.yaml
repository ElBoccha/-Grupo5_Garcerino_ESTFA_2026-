services:
  - type: web
    name: hotelghino
    runtime: python
    rootDir: Codigo
    buildCommand: bash build.sh
    startCommand: gunicorn fierro.wsgi:application --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: hotelghino-db
          property: connectionString

databases:
  - name: hotelghino-db
    databaseName: hotelghino
    user: hotelghino
