{% extends 'base.html' %}

{% block title %}Modificar datos - Hotelghino{% endblock %}

{% block content %}
<main class="page-narrow">
    <section class="panel">
        <p class="eyebrow">Cuenta</p>
        <h1>Modificar datos del usuario</h1>

        <form method="post" class="form-stack">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="button button-primary" type="submit">Guardar cambios</button>
        </form>

        <p class="panel-footer"><a href="{% url 'configuracion' %}">Volver a configuracion</a></p>
    </section>
</main>
{% endblock %}
