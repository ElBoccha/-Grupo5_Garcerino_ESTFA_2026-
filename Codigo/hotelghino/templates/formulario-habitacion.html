{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="{% static 'css/style4.css' %}">
</head>
<body>
    <main class="panel-configuracion">
        <h1>{{ titulo }}</h1>
        <p>{{ alojamiento.nombre }}</p>

        <form method="POST" class="formulario-usuario">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">{{ boton }}</button>
        </form>

        <a href="{% url 'mis_hoteles' %}">Volver a mis hoteles</a>
    </main>
</body>
</html>
