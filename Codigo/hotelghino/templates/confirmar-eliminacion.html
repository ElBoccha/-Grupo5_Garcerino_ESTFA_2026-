{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="{% static 'css/style4.css' %}">
</head>
<body>
    <main class="panel-configuracion">
        <h1>{{ titulo }}</h1>
        <p>Estas seguro de que queres eliminar "{{ objeto }}"?</p>

        <form method="POST" class="acciones">
            {% csrf_token %}
            <button class="boton-peligro" type="submit">Eliminar</button>
            <a class="boton-secundario" href="{% url cancelar_url %}">Cancelar</a>
        </form>
    </main>
</body>
</html>
