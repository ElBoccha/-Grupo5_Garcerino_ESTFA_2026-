{% extends 'base.html' %}

{% block title %}{{ titulo }} - Hotelghino{% endblock %}

{% block content %}
<main class="page-narrow">
    <section class="panel panel-confirmacion">
        <div class="confirmacion-icono">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </div>

        <div class="panel-header">
            <p class="eyebrow">Acción irreversible</p>
            <h1>{{ titulo }}</h1>
        </div>

        <p class="confirmacion-texto">
            ¿Estás seguro de que querés eliminar <strong>"{{ objeto }}"</strong>?
            <br>
            <span class="confirmacion-advertencia">Esta acción no se puede deshacer.</span>
        </p>

        <form method="post" class="actions" id="form-confirmacion">
            {% csrf_token %}
            <button class="button button-danger" id="btn-confirmar-eliminar" type="submit">
                Sí, eliminar
            </button>
            <a class="button button-secondary" id="btn-cancelar-eliminar" href="{% url cancelar_url %}">
                Cancelar
            </a>
        </form>
    </section>
</main>
{% endblock %}
